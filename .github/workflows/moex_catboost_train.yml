name: MOEX Unified CatBoost Research

# Research-only workflow on the isolated MOEX training branch.
on:
  push:
    branches:
      - moex-catboost-unified-20260904
    paths:
      - 'research/moex_unified_train.py'
      - '.github/workflows/moex_catboost_train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn catboost

      - name: Train and export
        run: python research/moex_unified_train.py

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMOEX_UNIFIED_CATBOOST_RESULTS
          path: artifacts/moex_unified/
          if-no-files-found: warn
          retention-days: 30
