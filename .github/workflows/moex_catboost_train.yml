name: MOEX Unified CatBoost Research

on:
  push:
    branches:
      - moex-catboost-unified-20260904
    paths:
      - 'research/moex_unified_train.py'
      - 'research/moex_unified_train_v2.py'
      - '.github/workflows/moex_catboost_train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn catboost
      - name: Robust first-passage research
        run: python research/moex_unified_train_v2.py
      - name: Upload V2 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMOEX_UNIFIED_CATBOOST_V2_RESULTS
          path: artifacts/moex_unified_v2/
          if-no-files-found: warn
          retention-days: 30
