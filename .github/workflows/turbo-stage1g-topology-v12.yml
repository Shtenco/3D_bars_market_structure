name: TURBO Stage-1H EML Dataflow Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install official QEMU and GRUB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xz-utils zstd grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version

      - name: Restore exact Stage-1H EML ELF
        run: |
          set -euo pipefail
          B=stage1f-integrated
          G=stage1g-topology
          H=stage1h-eml
          mkdir -p "$H"
          cat "$B"/kernel.part.* | base64 -d > "$H"/old.elf.xz
          echo '1c11a60acad502023c1e91aa9d92a3f4c4be730ba9e27c55a02d22238594b6d2  stage1h-eml/old.elf.xz' | sha256sum -c -
          xz -dc "$H"/old.elf.xz > "$H"/old.elf
          tr -d '[:space:]' < "$B"/kernel-stack-fix.zpatch.b64 | base64 -d > "$H"/p1
          zstd -d --patch-from="$H"/old.elf "$H"/p1 -o "$H"/k1.elf
          echo 'b2328b86c496d5cd53199ece697932a03108f8ccb7ec992239978dd8f070e7c7  stage1h-eml/k1.elf' | sha256sum -c -
          tr -d '[:space:]' < "$B"/kernel-idle-guard-fix.zpatch.b64 | base64 -d > "$H"/p2
          zstd -d --patch-from="$H"/k1.elf "$H"/p2 -o "$H"/k2.elf
          cat "$B"/kernel-canonical-idle-fix.part.* | tr -d '[:space:]' | base64 -d > "$H"/p3
          zstd -d --patch-from="$H"/k2.elf "$H"/p3 -o "$H"/v11.elf
          echo '23e245e581e2b7ae0e35a183db12ffba34e0a322aca64beb0e7281cc2f9a8a94  stage1h-eml/v11.elf' | sha256sum -c -
          tr -d '[:space:]' < "$G"/kernel-stage1g-topology-v12.zpatch.b64 | base64 -d > "$H"/p4
          zstd -d --patch-from="$H"/v11.elf "$H"/p4 -o "$H"/v12.elf
          echo '825b39fc3afb3481db2fa7853d81600a9b2a0cd20b8775b9e07152f7aa2138e4  stage1h-eml/v12.elf' | sha256sum -c -
          tr -d '[:space:]' < "$H"/v12-to-v13.zpatch.b64 | base64 -d > "$H"/p5
          echo '0a492a673d0ed3f9f9ce4829afb783e40f2d91aa6b254845000a099d8660690c  stage1h-eml/p5' | sha256sum -c -
          zstd -d --patch-from="$H"/v12.elf "$H"/p5 -o "$H"/turbo-kernel.elf
          echo '1cb8eef9515121925c4df82f0764463be009e0498388a31065513db9f4723d40  stage1h-eml/turbo-kernel.elf' | sha256sum -c -
          readelf -h "$H"/turbo-kernel.elf

      - name: Build trusted Multiboot2 ISO
        run: |
          set -euo pipefail
          D=stage1h-eml
          mkdir -p "$D"/iso/boot/grub
          cp "$D"/turbo-kernel.elf "$D"/iso/boot/turbo-kernel-release.elf
          printf '%s\n' 'set timeout=0' 'set default=0' 'menuentry "TURBO META OS Stage-1H EML Dataflow" {' ' multiboot2 /boot/turbo-kernel-release.elf' ' boot' '}' > "$D"/iso/boot/grub/grub.cfg
          grub-mkrescue -o "$D"/turbo-stage1h.iso "$D"/iso >/dev/null

      - name: Real 4-vCPU QEMU EML gate
        shell: bash
        run: |
          set -euo pipefail
          D=stage1h-eml
          LOG="$D/qemu-stage1h.log"
          DBG="$D/qemu-stage1h-int.log"
          : > "$LOG"
          : > "$DBG"
          set +e
          timeout 20s qemu-system-x86_64 -m 256M -smp 4 -machine q35,accel=tcg -cpu max -device virtio-serial-pci -cdrom "$D/turbo-stage1h.iso" -boot d -serial file:"$LOG" -d int,cpu_reset -D "$DBG" -display none -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          cat "$LOG"
          [[ $status -eq 0 || $status -eq 124 ]]
          required=(
            TURBO_RUNTIME_WX_PASS TURBO_SMP_ONLINE_COUNT=4 TURBO_TLB_SHOOTDOWN_PASS
            TURBO_STAGE1G_TOPOLOGY_CORE_READY TURBO_STAGE1H_EML_DATAFLOW_CORE_READY
            TURBO_TOPOLOGY_FABRIC_READY TURBO_TOPOLOGY_K6_READY
            TURBO_TOPOLOGY_LOCALITY_SCHEDULER_READY TURBO_TOPOLOGY_EDGE_ISOLATION_PASS
            TURBO_EML_BOUNDED_DAG_READY TURBO_EML_RING3_ONLY_TCB_PASS
            TURBO_COMPUTE_ELF_LOADED TURBO_EML_DATAFLOW_PERSONALITY_READY
            TURBO_RING3_RAMFS_ELF_PASS TURBO_RING3_RAMFS_CLIENT_E2E_PASS
            TURBO_RING3_VIRTIO_MODERN_TRANSPORT_PASS TURBO_RING3_EML_DATAFLOW_PASS
            TURBO_TOPOLOGY_EML_E2E_PASS TURBO_PREEMPTIVE_TIMER_PASS
            TURBO_STAGE1G_TOPOLOGY_NATIVE_COMPLETE TURBO_STAGE1H_EML_DATAFLOW_COMPLETE
          )
          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$LOG" || { echo "missing marker: $marker" >&2; exit 1; }
          done
          [[ $(grep -Fc TURBO_PROCESS_TEARDOWN_PASS "$LOG" || true) -eq 6 ]]
          ! grep -Fq '[TURBO PANIC]' "$LOG"
          ! grep -Fq '[TURBO EXCEPTION]' "$LOG"
          echo TURBO_QEMU_STAGE1H_EML_DATAFLOW_PASS | tee -a "$LOG"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-stage1h-eml-dataflow-evidence
          path: |
            stage1h-eml/qemu-stage1h.log
            stage1h-eml/qemu-stage1h-int.log
            stage1h-eml/turbo-kernel.elf
            stage1h-eml/turbo-stage1h.iso
