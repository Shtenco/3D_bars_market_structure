name: TURBO Stage-1I XPU Device Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install official QEMU and GRUB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xz-utils zstd grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version

      - name: Restore exact Stage-1I ELF and block image
        run: |
          set -euo pipefail
          B=stage1f-integrated
          G=stage1g-topology
          H=stage1h-eml
          I=stage1i-xpu
          mkdir -p "$I"

          cat "$B"/kernel.part.* | base64 -d > "$I"/old.elf.xz
          echo '1c11a60acad502023c1e91aa9d92a3f4c4be730ba9e27c55a02d22238594b6d2  stage1i-xpu/old.elf.xz' | sha256sum -c -
          xz -dc "$I"/old.elf.xz > "$I"/old.elf

          tr -d '[:space:]' < "$B"/kernel-stack-fix.zpatch.b64 | base64 -d > "$I"/p1
          zstd -d --patch-from="$I"/old.elf "$I"/p1 -o "$I"/k1.elf
          echo 'b2328b86c496d5cd53199ece697932a03108f8ccb7ec992239978dd8f070e7c7  stage1i-xpu/k1.elf' | sha256sum -c -

          tr -d '[:space:]' < "$B"/kernel-idle-guard-fix.zpatch.b64 | base64 -d > "$I"/p2
          zstd -d --patch-from="$I"/k1.elf "$I"/p2 -o "$I"/k2.elf
          cat "$B"/kernel-canonical-idle-fix.part.* | tr -d '[:space:]' | base64 -d > "$I"/p3
          zstd -d --patch-from="$I"/k2.elf "$I"/p3 -o "$I"/v11.elf
          echo '23e245e581e2b7ae0e35a183db12ffba34e0a322aca64beb0e7281cc2f9a8a94  stage1i-xpu/v11.elf' | sha256sum -c -

          tr -d '[:space:]' < "$G"/kernel-stage1g-topology-v12.zpatch.b64 | base64 -d > "$I"/p4
          zstd -d --patch-from="$I"/v11.elf "$I"/p4 -o "$I"/v12.elf
          echo '825b39fc3afb3481db2fa7853d81600a9b2a0cd20b8775b9e07152f7aa2138e4  stage1i-xpu/v12.elf' | sha256sum -c -

          tr -d '[:space:]' < "$H"/v12-to-v13.zpatch.b64 | base64 -d > "$I"/p5
          zstd -d --patch-from="$I"/v12.elf "$I"/p5 -o "$I"/v13.elf
          echo '1cb8eef9515121925c4df82f0764463be009e0498388a31065513db9f4723d40  stage1i-xpu/v13.elf' | sha256sum -c -

          tr -d '[:space:]' < "$I"/v13-to-v14.zpatch.b64 | base64 -d > "$I"/p6
          echo 'cff2ae7644eacb25b3648a1c56c47d66f43e41605eb1c8834238cf313ae9f591  stage1i-xpu/p6' | sha256sum -c -
          zstd -d --patch-from="$I"/v13.elf "$I"/p6 -o "$I"/v14-pre.elf
          echo 'ca0c374cf94e5a16c6c7789de0356c980faf1066dd1727da8a84fe384449aa9c  stage1i-xpu/v14-pre.elf' | sha256sum -c -

          tr -d '[:space:]' < "$I"/v14-device-elf-loader-fix.zpatch.b64 | base64 -d > "$I"/p7
          echo '86c01793ad3325e10a238bc533cab68d32f0350d1a0068ca76ecb75d5c629f16  stage1i-xpu/p7' | sha256sum -c -
          zstd -d --patch-from="$I"/v14-pre.elf "$I"/p7 -o "$I"/v14-loader.elf
          echo 'd7529750fe7c307bdc7f00f14b41b289d0d9533718b8b0265e319b0505357440  stage1i-xpu/v14-loader.elf' | sha256sum -c -

          tr -d '[:space:]' < "$I"/v14-optional-cap-fix.zpatch.b64 | base64 -d > "$I"/p8
          echo 'c37ad823a1d086e676f427028829759fac041b3cddfdd06345dfd68212e4fd3c  stage1i-xpu/p8' | sha256sum -c -
          zstd -d --patch-from="$I"/v14-loader.elf "$I"/p8 -o "$I"/turbo-kernel.elf
          echo '0bf3ffdd9ad2dd2ef2502ebb621c5d2613b553e069f7a7a0b535f11805c083ca  stage1i-xpu/turbo-kernel.elf' | sha256sum -c -

          tr -d '[:space:]' < "$I"/xpu-sector.img.b64 | base64 -d > "$I"/xpu-sector.img
          echo 'd2a2267c7bb7490d36e5a439c1afc7b6d56fb458c892cb38ddc3eaa0879106b3  stage1i-xpu/xpu-sector.img' | sha256sum -c -
          test "$(stat -c %s "$I"/xpu-sector.img)" -eq 512
          readelf -h "$I"/turbo-kernel.elf

      - name: Build trusted Multiboot2 ISO
        run: |
          set -euo pipefail
          D=stage1i-xpu
          mkdir -p "$D"/iso/boot/grub
          cp "$D"/turbo-kernel.elf "$D"/iso/boot/turbo-kernel-release.elf
          printf '%s\n' \
            'set timeout=0' \
            'set default=0' \
            'menuentry "TURBO META OS Stage-1I XPU Device" {' \
            ' multiboot2 /boot/turbo-kernel-release.elf' \
            ' boot' \
            '}' > "$D"/iso/boot/grub/grub.cfg
          grub-mkrescue -o "$D"/turbo-stage1i.iso "$D"/iso >/dev/null
          test -s "$D"/turbo-stage1i.iso

      - name: Real 4-vCPU virtio-block QEMU gate
        shell: bash
        run: |
          set -euo pipefail
          D=stage1i-xpu
          LOG="$D/qemu-stage1i.log"
          DBG="$D/qemu-stage1i-int.log"
          : > "$LOG"
          : > "$DBG"
          set +e
          timeout 30s qemu-system-x86_64 \
            -m 256M -smp 4 \
            -machine q35,accel=tcg -cpu max \
            -drive file="$D/xpu-sector.img",if=none,id=xpu0,format=raw,readonly=on \
            -device virtio-blk-pci,drive=xpu0,disable-legacy=on,disable-modern=off,bus=pcie.0,addr=0x5 \
            -cdrom "$D/turbo-stage1i.iso" -boot d \
            -serial file:"$LOG" -d int,cpu_reset -D "$DBG" \
            -display none -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          cat "$LOG" || true
          [[ $status -eq 0 || $status -eq 124 ]]

          required=(
            TURBO_RUNTIME_WX_PASS TURBO_LAPIC_IOAPIC_READY TURBO_LAPIC_TIMER_CALIBRATED
            TURBO_SMP_ONLINE_COUNT=4 TURBO_SMP_PERCPU_READY TURBO_PROCESS_SCHEDULER_CPUS=4
            TURBO_TLB_SHOOTDOWN_PASS TURBO_BLOCKING_IPC_READY TURBO_TOPOLOGY_FABRIC_READY
            TURBO_STAGE1G_TOPOLOGY_CORE_READY TURBO_STAGE1H_EML_DATAFLOW_CORE_READY
            TURBO_STAGE1I_XPU_DEVICE_CORE_READY TURBO_XPU_DEVICE_CELL_READY
            TURBO_TOPOLOGY_K6_READY TURBO_TOPOLOGY_LOCALITY_SCHEDULER_READY
            TURBO_MEMORY_OBJECT_SYSCALL_ABI_READY TURBO_IPC_CAP_TRANSFER_READY
            TURBO_STRICT_ELF64_LOADER_READY TURBO_RING3_VFS_ELF_LOADER_READY
            TURBO_UNIVERSAL_PROCESS_TEARDOWN_READY TURBO_AP_VIRTUAL_GUARD_STACKS_READY
            TURBO_RAMFS_NAMESPACE_CORE_READY TURBO_VFS_REQUEST_REPLY_READY
            TURBO_EML_BOUNDED_DAG_READY TURBO_EML_RING3_ONLY_TCB_PASS
            TURBO_COMPUTE_ELF_LOADED TURBO_EML_DATAFLOW_PERSONALITY_READY TURBO_XPU_DEVICE_ELF_LOADED
            TURBO_RING3_INIT_READY_PASS TURBO_ADDRESS_SPACE_ISOLATION_OK
            TURBO_USERSPACE_CONSOLE_IPC_PASS TURBO_RING3_CAP_TRANSFER_MEMORY_PASS
            TURBO_TOPOLOGY_NATIVE_IO_PASS TURBO_RING3_RAMFS_ELF_PASS
            TURBO_RING3_RAMFS_CLIENT_E2E_PASS TURBO_RING3_EML_DATAFLOW_PASS
            TURBO_TOPOLOGY_EML_E2E_PASS TURBO_VIRTIO_PCI_CAPS_PASS
            TURBO_VIRTIO_BAR_APERTURE_PASS TURBO_VIRTIO_FEATURES_OK
            TURBO_VIRTQUEUE_REAL_NOTIFY_PASS TURBO_VIRTQUEUE_REAL_USED_COMPLETION_PASS
            TURBO_DMA_WINDOW_BOUNDS_PASS TURBO_RING3_EML_DEVICE_DATAFLOW_PASS
            TURBO_DEVICE_TO_EML_DATAFLOW_PASS TURBO_VFS_DEVICE_SECTOR_READ_PASS
            TURBO_PREEMPTIVE_TIMER_PASS TURBO_STAGE1G_TOPOLOGY_NATIVE_COMPLETE
            TURBO_STAGE1H_EML_DATAFLOW_COMPLETE TURBO_STAGE1I_XPU_DEVICE_COMPLETE
          )
          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$LOG" || { echo "missing marker: $marker" >&2; exit 1; }
          done
          [[ $(grep -Fc TURBO_PROCESS_TEARDOWN_PASS "$LOG" || true) -eq 6 ]] || { echo 'expected exactly six teardown markers' >&2; exit 1; }
          ! grep -Fq '[TURBO PANIC]' "$LOG"
          ! grep -Fq '[TURBO EXCEPTION]' "$LOG"
          ! grep -Fq 'turbo_virtqueue_device_complete' "$LOG"
          echo TURBO_QEMU_STAGE1I_XPU_DEVICE_PASS | tee -a "$LOG"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-stage1i-xpu-device-evidence
          if-no-files-found: warn
          path: |
            stage1i-xpu/qemu-stage1i.log
            stage1i-xpu/qemu-stage1i-int.log
            stage1i-xpu/turbo-kernel.elf
            stage1i-xpu/turbo-stage1i.iso
            stage1i-xpu/xpu-sector.img
