name: TURBO Stage-1F Canonical Idle Runtime
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qemu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official QEMU and GRUB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xz-utils zstd grub-pc-bin grub-common xorriso mtools
      - name: Restore exact canonical-idle ELF
        run: |
          set -euo pipefail
          D=stage1f-integrated
          cat "$D"/kernel.part.* | base64 -d > "$D"/old.elf.xz
          echo '1c11a60acad502023c1e91aa9d92a3f4c4be730ba9e27c55a02d22238594b6d2  stage1f-integrated/old.elf.xz' | sha256sum -c -
          xz -dc "$D"/old.elf.xz > "$D"/old.elf
          tr -d '[:space:]' < "$D"/kernel-stack-fix.zpatch.b64 | base64 -d > "$D"/p1
          zstd -d --patch-from="$D"/old.elf "$D"/p1 -o "$D"/k1.elf
          echo 'b2328b86c496d5cd53199ece697932a03108f8ccb7ec992239978dd8f070e7c7  stage1f-integrated/k1.elf' | sha256sum -c -
          tr -d '[:space:]' < "$D"/kernel-idle-guard-fix.zpatch.b64 | base64 -d > "$D"/p2
          zstd -d --patch-from="$D"/k1.elf "$D"/p2 -o "$D"/k2.elf
          echo 'c2bb5922fee670c4eea81892fa9796eb12a289d419fe5c7a29fbc8b89208576d  stage1f-integrated/k2.elf' | sha256sum -c -
          cat "$D"/kernel-canonical-idle-fix.part.* | tr -d '[:space:]' | base64 -d > "$D"/p3
          echo '483a9e30a6c1b19f5c5a8c263fea46a760635b8df1e985192895a9700ef36a77  stage1f-integrated/p3' | sha256sum -c -
          zstd -d --patch-from="$D"/k2.elf "$D"/p3 -o "$D"/turbo-kernel.elf
          echo '23e245e581e2b7ae0e35a183db12ffba34e0a322aca64beb0e7281cc2f9a8a94  stage1f-integrated/turbo-kernel.elf' | sha256sum -c -
      - name: Build Multiboot2 ISO
        run: |
          set -euo pipefail
          D=stage1f-integrated
          mkdir -p "$D"/iso/boot/grub
          cp "$D"/turbo-kernel.elf "$D"/iso/boot/turbo-kernel.elf
          printf '%s\n' 'set timeout=0' 'menuentry "TURBO" {' ' multiboot2 /boot/turbo-kernel.elf' ' boot' '}' > "$D"/iso/boot/grub/grub.cfg
          grub-mkrescue -o "$D"/turbo.iso "$D"/iso >/dev/null
      - name: Real 4-vCPU QEMU gate
        run: |
          set -euo pipefail
          D=stage1f-integrated
          LOG="$D/qemu.log"
          DBG="$D/qemu-int.log"
          : > "$LOG"
          : > "$DBG"
          set +e
          timeout 20s qemu-system-x86_64 -m 256M -smp 4 -machine q35,accel=tcg -cpu max -device virtio-serial-pci -cdrom "$D/turbo.iso" -boot d -serial file:"$LOG" -d int,cpu_reset -D "$DBG" -display none -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          cat "$LOG"
          [[ $status -eq 0 || $status -eq 124 ]]
          for m in TURBO_RUNTIME_WX_PASS TURBO_SMP_ONLINE_COUNT=4 TURBO_TLB_SHOOTDOWN_PASS TURBO_STAGE1F_INTEGRATED_CORE_READY TURBO_LINUX_ELF_PERSONALITY_INTEGRATED TURBO_LINUX_WRITE_PASS TURBO_LINUX_MMAP_PASS TURBO_LINUX_MUNMAP_PASS TURBO_LINUX_BRK_PASS TURBO_LINUX_EXIT_PASS TURBO_STAGE1F_INTEGRATED_COMPLETE; do grep -Fq "$m" "$LOG"; done
          [[ $(grep -Fc TURBO_PROCESS_TEARDOWN_PASS "$LOG" || true) -eq 6 ]]
          ! grep -Fq '[TURBO PANIC]' "$LOG"
          ! grep -Fq '[TURBO EXCEPTION]' "$LOG"
          echo TURBO_QEMU_STAGE1F_CANONICAL_IDLE_PASS | tee -a "$LOG"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-stage1f-canonical-idle-evidence
          path: |
            stage1f-integrated/qemu.log
            stage1f-integrated/qemu-int.log
            stage1f-integrated/turbo-kernel.elf
            stage1f-integrated/turbo.iso
